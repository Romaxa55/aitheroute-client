name: tests
# The client's own tests (this repository is kept in sync from the private one
# the gateway lives in). The setup on Linux and macOS; the sign-in helper on
# Linux, where its isolated session runs and where its tests are kept.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: sh -n clients/setup/install.sh && sh -n clients/setup/bundle/start.sh
      - run: node --test clients/setup/test/*.test.mjs
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node --test clients/login/test/*.test.mjs
  secrets:
    # Every commit, against .gitleaks.toml (gitleaks' rules and this service's tokens).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan every commit for secrets (gitleaks)
        run: |
          set -euo pipefail
          version=8.30.1
          sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="gitleaks_${version}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/$archive"
          echo "$sha  $archive" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml
