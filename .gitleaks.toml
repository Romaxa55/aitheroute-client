# Secrets this repository must never hold: gitleaks' own rules (API keys of
# Anthropic and others among them), plus the two tokens of this service.
[extend]
useDefault = true

[[rules]]
id = "aitheroute-token"
description = "AI The Route token: atr_ and 32 random bytes in base64url"
regex = '''atr_[A-Za-z0-9_-]{40,}'''
keywords = ["atr_"]

[[rules]]
id = "claude-sign-in-token"
description = "Claude Code sign-in token (claude setup-token)"
regex = '''sk-ant-oat[0-9]{2}-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant-oat"]
